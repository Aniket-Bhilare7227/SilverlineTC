version: "3.8"

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: silverlineTC
    restart: unless-stopped
    expose:
      - "3000"   # internal only
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: marketing_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
