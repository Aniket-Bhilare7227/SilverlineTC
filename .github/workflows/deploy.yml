name: Deploy to EC2

on:
  push:
    branches:
      - main   # 👉 जर तुझा branch वेगळा असेल तर इथे बदल

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repo checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ SSH key setup
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 52.66.126.190 >> ~/.ssh/known_hosts

      # 3️⃣ Test SSH connection (optional but helps debugging)
      - name: Test SSH connection
        run: |
          echo "Testing SSH connection..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@52.66.126.190 "echo '✅ Connected to EC2 successfully'"

      # 4️⃣ Deploy code using rsync
      - name: Deploy code to EC2
        run: |
          echo "🚀 Deploying files to EC2..."
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ubuntu@52.66.126.190:/home/ubuntu/SilverlineTC

      # 5️⃣ Restart app using PM2 (if applicable)
      - name: Restart app on EC2
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@52.66.126.190 << 'EOF'
            cd /home/ubuntu/SilverlineTC
            echo "🛠️ Pulling latest code and restarting app..."
            npm install --production
            pm2 restart all || pm2 start npm --name "SilverlineTC" -- run start
          EOF
