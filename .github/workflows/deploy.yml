name: Zero Downtime Deploy (Docker Compose)

on:
  push:
    branches:
      - main   # Trigger on push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Setup SSH key and known_hosts
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # Step 3: Deploy to EC2
      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd /home/ubuntu/SilverlineTC

            echo "🔹 Pulling latest code..."
            sudo git fetch origin main
            sudo git reset --hard origin/main

            echo "🛑 Stopping old containers..."
            sudo docker compose down || true

            echo "🧹 Removing unused data..."
            sudo docker system prune -af || true

            echo "🔹 Building new containers..."
            sudo docker compose build --no-cache

            echo "🚀 Starting containers..."
            sudo docker compose up -d

            echo "✅ Checking running containers..."
            sudo docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "🎉 Deployment completed successfully!"
          EOF

