name: Deploy SilverlineTC to EC2

on:
  push:
    branches:
      - main   # main branch वर push झाला की trigger होईल

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code from repo
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Setup SSH key safely
      - name: Setup SSH key
        shell: bash
        run: |
          mkdir -p $HOME/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > $HOME/.ssh/deploy_key
          chmod 600 $HOME/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> $HOME/.ssh/known_hosts

      # Step 3: Copy project files to EC2 using rsync
      - name: Copy project files to EC2
        shell: bash
        run: |
          rsync -avz -e "ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no" \
          --exclude '.git' --exclude '.github' ./ \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_DEPLOY_PATH }}

      # Step 4: SSH into EC2 and deploy using Docker Compose
      - name: Deploy SilverlineTC on EC2
        shell: bash
        run: |
          ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ${{ secrets.EC2_DEPLOY_PATH }}
            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d
            docker system prune -f
          EOF
