name: Zero Downtime Deploy (Docker Compose)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /home/ubuntu/SilverlineTC
            echo "🔹 Pulling latest code..."
            sudo git pull origin main

            echo "🔹 Building new containers..."
            sudo docker compose build

            echo "🔹 Starting new containers (temporary names)..."
            sudo docker compose -p silverlinetc_new up -d

            echo "⏳ Waiting for new containers to start..."
            sleep 10

            echo "🔹 Checking if new containers running..."
            if sudo docker ps | grep -q silverlinetc_new; then
              echo "✅ New containers running. Swapping..."
              sudo docker compose -p silverlinetc down
              sudo docker compose -p silverlinetc up -d
              echo "🧹 Cleaning temporary containers..."
              sudo docker compose -p silverlinetc_new down
              sudo docker image prune -f
            else
              echo "❌ New containers failed. Keeping old setup."
              sudo docker compose -p silverlinetc_new logs
              sudo docker compose -p silverlinetc_new down
            fi
          EOF
